name: docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run docs:build
        env:
          # GitHub Pages serves the project site from /<repo>/
          NUXT_APP_BASE_URL: /nuxt-image-viewer/
          # The bare origin: nuxt-site-config adds the base itself
          NUXT_SITE_URL: https://kukson777.github.io

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
